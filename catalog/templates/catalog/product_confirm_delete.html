{% extends 'catalog/base.html' %}

{% block title %}Удаление продукта - Каталог товаров{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title mb-0">Подтверждение удаления</h2>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить продукт <strong>"{{ object.name }}"</strong>?</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
